<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tj-db lib</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <style>
        :root {
            --bg: #080b12;
            --card: rgba(18, 24, 38, 0.92);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --accent1: #2563eb;
            --accent2: #4f46e5;
            --accent3: #7c3aed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, #1c2742 0%, transparent 45%),
                radial-gradient(circle at bottom right, #10203d 0%, transparent 35%),
                #080b12;
            color: var(--text);
        }

        .container {
            width: min(500px, 92vw);
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 50px 35px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .title-link {
            display: block;
            text-align: center;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 35px;
            color: #ffffff;
            text-decoration: none;
            transition: all 1.25s ease;
opacity: 0.3;
        }

        .title-link:hover {
            color: #8ab4ff;
            text-shadow:
                0 0 12px rgba(96, 165, 250, 0.6),
                0 0 24px rgba(96, 165, 250, 0.35);
opacity: 1;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn {
            position: relative;
            overflow: hidden;

            display: block;
            padding: 18px;
            text-align: center;
            text-decoration: none;

            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.6px;

            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);

            background: linear-gradient(
                135deg,
                var(--accent1),
                var(--accent2),
                var(--accent3)
            );

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .btn::before {
            content: "";
            position: absolute;
            inset: 0;

            background: linear-gradient(
                120deg,
                transparent 0%,
                rgba(255, 255, 255, 0.2) 50%,
                transparent 100%
            );

            transform: translateX(-120%);
            transition: transform 1.8s ease;
        }

        .btn:hover::before {
            transform: translateX(120%);
        }

        .btn:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);

            box-shadow:
                0 12px 35px rgba(79, 70, 229, 0.5),
                0 0 30px rgba(99, 102, 241, 0.35);
        }

        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">

        <a href="https://github.com/tj-db"
           target="_blank"
           rel="noopener noreferrer"
           class="title-link">
            tj-db
        </a>

        <div class="buttons">

            <a class="btn"
               href="https://tj-db.github.io/root/lib"
               target="_blank"
               rel="noopener noreferrer">
                Script Library
            </a>

            <a class="btn"
               href="https://tj-db.github.io/root/ESL/lib"
               target="_blank"
               rel="noopener noreferrer">
                ESL Library
            </a>

        </div>

    </div>

</body>
</html>
